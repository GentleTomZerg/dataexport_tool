# Examples for DB and job config (valid and invalid)

# ----------------------------
# DB CONFIG EXAMPLES
# ----------------------------

# Valid profile
primary.DB_HOST=localhost
primary.DB_PORT=3306
primary.DB_NAME=example_db
primary.DB_USER=example_user
primary.DB_TYPE=mysql
DB_PASSWORD_DIR=./etc/local/pwd

# Invalid profile examples
# - missing DB_USER
broken.DB_HOST=localhost
broken.DB_PORT=3306
broken.DB_NAME=example_db
# broken.DB_USER missing

# - non-numeric DB_PORT
badport.DB_HOST=localhost
badport.DB_PORT=abc
badport.DB_NAME=example_db
badport.DB_USER=example_user

# - unsupported DB_TYPE
badtype.DB_HOST=localhost
badtype.DB_PORT=3306
badtype.DB_NAME=example_db
badtype.DB_USER=example_user
badtype.DB_TYPE=oracle

# ----------------------------
# JOB CONFIG EXAMPLES
# ----------------------------

# Valid job
job.users.DB_PROFILE=primary
job.users.TABLE_NAME=users
job.users.COLUMNS=id,name,email,created_at
job.users.EXPORT_FILE=./exports/users_${EXPORT_DATE}.csv
job.users.FIELD_SEPARATOR=|
job.users.LINE_TERMINATOR=\n
job.users.FILTER.status=active
job.users.FILTER.created_at.op=>=
job.users.FILTER.created_at.value=2024-01-01

# Valid job with split, compress, transfer
job.articles.DB_PROFILE=primary
job.articles.TABLE_NAME=articles
job.articles.COLUMNS=id,title,body,created_at
job.articles.EXPORT_FILE=./exports/articles.csv
job.articles.SPLIT.body=4000,3
job.articles.COMPRESS.ENABLED=true
job.articles.COMPRESS.MODE=tar.gz
job.articles.COMPRESS.OVERWRITE=true
job.articles.TRANSFER.ENABLED=true
job.articles.TRANSFER.DIR=./transfer
job.articles.TRANSFER.MODE=move
job.articles.TRANSFER.RENAME=${JOB_NAME}_${EXPORT_DATE}${EXT}

# Invalid job examples
# - missing DB_PROFILE
job.missing_profile.TABLE_NAME=users
job.missing_profile.COLUMNS=id,name

# - empty column name (trailing comma)
job.bad_columns.DB_PROFILE=primary
job.bad_columns.TABLE_NAME=users
job.bad_columns.COLUMNS=id,name,

# - invalid split (column not in COLUMNS)
job.bad_split.DB_PROFILE=primary
job.bad_split.TABLE_NAME=users
job.bad_split.COLUMNS=id,name
job.bad_split.SPLIT.body=1000,2

# - invalid BETWEEN (missing to)
job.bad_between.DB_PROFILE=primary
job.bad_between.TABLE_NAME=users
job.bad_between.COLUMNS=id,name
job.bad_between.FILTER.created_at.op=BETWEEN
job.bad_between.FILTER.created_at.from=2024-01-01

# - invalid compress mode
job.bad_compress.DB_PROFILE=primary
job.bad_compress.TABLE_NAME=users
job.bad_compress.COLUMNS=id,name
job.bad_compress.COMPRESS.ENABLED=true
job.bad_compress.COMPRESS.MODE=zip

# - invalid transfer overwrite value
job.bad_transfer.DB_PROFILE=primary
job.bad_transfer.TABLE_NAME=users
job.bad_transfer.COLUMNS=id,name
job.bad_transfer.TRANSFER.ENABLED=true
job.bad_transfer.TRANSFER.DIR=./transfer
job.bad_transfer.TRANSFER.OVERWRITE=maybe
