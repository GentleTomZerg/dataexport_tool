# Basic successful job
job.users.DB_PROFILE=primary
job.users.TABLE_NAME=users
job.users.COLUMNS=id,name,email
job.users.EXPORT_FILE=${ENV_EXPORT_ROOT}/users_${EXPORT_DATE}.csv
job.users.WHERE=status = 'active'

# MySQL split-column example
job.article_body.DB_PROFILE=primary
job.article_body.TABLE_NAME=articles
job.article_body.COLUMNS=id,title,body,created_at
job.article_body.EXPORT_FILE=${ENV_EXPORT_ROOT}/articles_${EXPORT_DATE}.csv
job.article_body.WHERE=created_at >= '${MONTH_START}'
job.article_body.SPLIT.body=4000,3

# Date-variable usage
job.daily_orders.DB_PROFILE=primary
job.daily_orders.TABLE_NAME=orders
job.daily_orders.COLUMNS=id,total,created_at
job.daily_orders.EXPORT_FILE=${ENV_EXPORT_ROOT}/orders_${YESTERDAY}.csv
job.daily_orders.WHERE=created_at BETWEEN '${YESTERDAY}' AND '${TODAY}'

# Compression only
job.audit.DB_PROFILE=primary
job.audit.TABLE_NAME=audit_log
job.audit.COLUMNS=id,actor,action,created_at
job.audit.EXPORT_FILE=${ENV_ARCHIVE_ROOT}/audit_${EXPORT_MONTH}.csv
job.audit.WHERE=created_at BETWEEN '${MONTH_START}' AND '${MONTH_END}'
job.audit.COMPRESS.ENABLED=true
job.audit.COMPRESS.MODE=gz
job.audit.COMPRESS.OVERWRITE=true

# Transfer with rename
job.finance.DB_PROFILE=primary
job.finance.TABLE_NAME=finance_report
job.finance.COLUMNS=id,amount,biz_date
job.finance.EXPORT_FILE=${ENV_EXPORT_ROOT}/finance_${EXPORT_DATE}.csv
job.finance.WHERE=biz_date = '${EXPORT_DATE}'
job.finance.TRANSFER.ENABLED=true
job.finance.TRANSFER.DIR=${ENV_TRANSFER_ROOT}
job.finance.TRANSFER.MODE=copy
job.finance.TRANSFER.OVERWRITE=true
job.finance.TRANSFER.RENAME=${JOB_NAME}_${EXPORT_DATE}${EXT}

# Different profile, useful for plan inspection
job.reporting_snapshot.DB_PROFILE=reporting
job.reporting_snapshot.TABLE_NAME=reporting_snapshot
job.reporting_snapshot.COLUMNS=id,metric_name,metric_value
job.reporting_snapshot.EXPORT_FILE=${ENV_EXPORT_ROOT}/reporting_snapshot_${EXPORT_DATE}.txt
job.reporting_snapshot.FIELD_SEPARATOR=|
job.reporting_snapshot.LINE_TERMINATOR=\n
job.reporting_snapshot.WHERE=snapshot_date = '${EXPORT_DATE}'

# Invalid job on purpose: missing DB_PROFILE
job.invalid_missing_profile.TABLE_NAME=broken_table
job.invalid_missing_profile.COLUMNS=id
job.invalid_missing_profile.EXPORT_FILE=${ENV_EXPORT_ROOT}/broken.csv

# Invalid profile on purpose: profile does not exist
job.invalid_unknown_profile.DB_PROFILE=ghost
job.invalid_unknown_profile.TABLE_NAME=ghost_table
job.invalid_unknown_profile.COLUMNS=id
job.invalid_unknown_profile.EXPORT_FILE=${ENV_EXPORT_ROOT}/ghost.csv
