# Export job configuration (multi-job)
# This file defines what data to export. It is separate from DB profiles.
#
# Runtime date variables are set by export_data.sh (via --date or today):
#   ${EXPORT_DATE}, ${TODAY}, ${YESTERDAY}, ${EXPORT_MONTH}, ${MONTH_START}, ${MONTH_END}

# Job: users (basic filters)
job.users.DB_PROFILE=primary
job.users.TABLE_NAME=users
job.users.COLUMNS=id,name,email,created_at
job.users.EXPORT_FILE=./exports/${job.users.TABLE_NAME}_${EXPORT_DATE}.csv
job.users.FILTER.status=active
job.users.FILTER.created_at.value=2024-01-01
job.users.FILTER.created_at.op=>=

# Job: orders
job.orders.DB_PROFILE=primary
job.orders.TABLE_NAME=orders
job.orders.COLUMNS=id,user_id,total,created_at
job.orders.EXPORT_FILE=./exports/orders.csv
job.orders.FILTER.status=paid

# Job: events (BETWEEN example using explicit date)
job.events.DB_PROFILE=primary
job.events.TABLE_NAME=events
job.events.COLUMNS=id,type,created_at
job.events.EXPORT_FILE=./exports/events.csv
job.events.FILTER.created_at.op=BETWEEN
job.events.FILTER.created_at.from=${EXPORT_DATE}
job.events.FILTER.created_at.to=${EXPORT_DATE}

# Job: daily_events (BETWEEN using runtime dates)
job.daily_events.DB_PROFILE=primary
job.daily_events.TABLE_NAME=events
job.daily_events.COLUMNS=id,type,created_at
job.daily_events.EXPORT_FILE=./exports/events_${YESTERDAY}.csv
job.daily_events.FILTER.created_at.op=BETWEEN
job.daily_events.FILTER.created_at.from=${YESTERDAY}
job.daily_events.FILTER.created_at.to=${TODAY}

# Job: monthly_events (BETWEEN using month window)
job.monthly_events.DB_PROFILE=primary
job.monthly_events.TABLE_NAME=events
job.monthly_events.COLUMNS=id,type,created_at
job.monthly_events.EXPORT_FILE=./exports/events_${EXPORT_MONTH}.csv
job.monthly_events.FILTER.created_at.op=BETWEEN
job.monthly_events.FILTER.created_at.from=${MONTH_START}
job.monthly_events.FILTER.created_at.to=${MONTH_END}

# Job: monthly_events (MONTH example)
job.monthly_events.DB_PROFILE=primary
job.monthly_events.TABLE_NAME=events
job.monthly_events.COLUMNS=id,type,created_at
job.monthly_events.EXPORT_FILE=./exports/events_${EXPORT_MONTH}.csv
job.monthly_events.FILTER.created_at.op=BETWEEN
job.monthly_events.FILTER.created_at.from=${MONTH_START}
job.monthly_events.FILTER.created_at.to=${MONTH_END}

# Job: customers (LIKE example)
job.customers.DB_PROFILE=primary
job.customers.TABLE_NAME=customers
job.customers.COLUMNS=id,name,email,created_at
job.customers.EXPORT_FILE=./exports/customers.csv
job.customers.FILTER.name.op=LIKE
job.customers.FILTER.name.value=%john%

# Job: invoices (operator examples)
job.invoices.DB_PROFILE=primary
job.invoices.TABLE_NAME=invoices
job.invoices.COLUMNS=id,amount,status,created_at
job.invoices.EXPORT_FILE=./exports/invoices.csv
job.invoices.FILTER.amount.op=>=
job.invoices.FILTER.amount.value=100
job.invoices.FILTER.status.op!=
job.invoices.FILTER.status.value=void

# Job: sessions (combined filters: BETWEEN + LIKE + >=)
job.sessions.DB_PROFILE=primary
job.sessions.TABLE_NAME=sessions
job.sessions.COLUMNS=id,user_id,device,created_at
job.sessions.EXPORT_FILE=./exports/sessions.csv
job.sessions.FILTER.created_at.op=BETWEEN
job.sessions.FILTER.created_at.from=${MONTH_START}
job.sessions.FILTER.created_at.to=${MONTH_END}
job.sessions.FILTER.device.op=LIKE
job.sessions.FILTER.device.value=%iPhone%
job.sessions.FILTER.user_id.op=>=
job.sessions.FILTER.user_id.value=1000
