# Database configuration
# Profiles: comma-separated list
DB_PROFILES=primary,reporting

# primary profile
primary.DB_HOST=localhost
primary.DB_PORT=3306
primary.DB_NAME=example_db
primary.DB_USER=example_user
primary.DB_TYPE=mysql

# reporting profile
reporting.DB_HOST=192.168.10.20
reporting.DB_PORT=3306
reporting.DB_NAME=reporting_db
reporting.DB_USER=report_user
reporting.DB_TYPE=mysql

# Where encrypted password files live (optional)
DB_PASSWORD_DIR=./secrets
