# Export configuration (DB profiles + jobs)
#
# Runtime date variables are set by export_data.sh (via --date or today):
#   ${EXPORT_DATE}, ${TODAY}, ${YESTERDAY}, ${EXPORT_MONTH}, ${MONTH_START}, ${MONTH_END}
#
# ENV_* variables come from etc/local/env.properties and can be referenced here.

# ----------------------------
# DB PROFILES (all fields required)
# ----------------------------

primary.DB_HOST=localhost
primary.DB_PORT=3306
primary.DB_NAME=example_db
primary.DB_USER=example_user
primary.DB_TYPE=mysql
primary.DB_PASSWORD_DIR=./etc/local/pwd
primary.DB_PASSWORD_KEY_FILE=./etc/local/pwd/key_file

reporting.DB_HOST=rep-host
reporting.DB_PORT=5432
reporting.DB_NAME=rep_db
reporting.DB_USER=rep_user
reporting.DB_TYPE=postgres
reporting.DB_PASSWORD_DIR=./etc/local/pwd
reporting.DB_PASSWORD_KEY_FILE=./etc/local/pwd/key_file

# ----------------------------
# JOBS (test cases covering supported features)
# ----------------------------

# Job: users (simple WHERE clause)
job.users.DB_PROFILE=primary
job.users.TABLE_NAME=users
job.users.COLUMNS=id,name,email,created_at
job.users.EXPORT_FILE=./exports/${job.users.TABLE_NAME}_${EXPORT_DATE}.csv
job.users.FIELD_SEPARATOR=|
job.users.LINE_TERMINATOR=\n
job.users.WHERE=status = 'active' AND created_at >= '2024-01-01'

# Job: orders (simple equality)
job.orders.DB_PROFILE=primary
job.orders.TABLE_NAME=orders
job.orders.COLUMNS=id,user_id,total,created_at
job.orders.EXPORT_FILE=./exports/orders.csv
job.orders.WHERE=status = 'paid'

# Job: events (explicit date range)
job.events.DB_PROFILE=primary
job.events.TABLE_NAME=events
job.events.COLUMNS=id,type,created_at
job.events.EXPORT_FILE=./exports/events.csv
job.events.WHERE=created_at BETWEEN '${EXPORT_DATE}' AND '${EXPORT_DATE}'

# Job: daily_events (BETWEEN using runtime dates)
job.daily_events.DB_PROFILE=primary
job.daily_events.TABLE_NAME=events
job.daily_events.COLUMNS=id,type,created_at
job.daily_events.EXPORT_FILE=./exports/events_${YESTERDAY}.csv
job.daily_events.WHERE=created_at BETWEEN '${YESTERDAY}' AND '${TODAY}'

# Job: monthly_events (BETWEEN using month window)
job.monthly_events.DB_PROFILE=primary
job.monthly_events.TABLE_NAME=events
job.monthly_events.COLUMNS=id,type,created_at
job.monthly_events.EXPORT_FILE=./exports/events_${EXPORT_MONTH}.csv
job.monthly_events.WHERE=created_at BETWEEN '${MONTH_START}' AND '${MONTH_END}'

# Job: customers (LIKE)
job.customers.DB_PROFILE=primary
job.customers.TABLE_NAME=customers
job.customers.COLUMNS=id,name,email,created_at
job.customers.EXPORT_FILE=./exports/customers.csv
job.customers.WHERE=name LIKE '%john%'

# Job: invoices (mixed operators)
job.invoices.DB_PROFILE=primary
job.invoices.TABLE_NAME=invoices
job.invoices.COLUMNS=id,amount,status,created_at
job.invoices.EXPORT_FILE=./exports/invoices.csv
job.invoices.WHERE=amount >= 100 AND status != 'void'

# Job: sessions (combined: BETWEEN + LIKE + >=)
job.sessions.DB_PROFILE=primary
job.sessions.TABLE_NAME=sessions
job.sessions.COLUMNS=id,user_id,device,created_at
job.sessions.EXPORT_FILE=./exports/sessions.csv
job.sessions.WHERE=created_at BETWEEN '${MONTH_START}' AND '${MONTH_END}' AND device LIKE '%iPhone%' AND user_id >= 1000

# Job: articles (TEXT split + compress + transfer, MySQL only)
job.articles.DB_PROFILE=primary
job.articles.TABLE_NAME=articles
job.articles.COLUMNS=id,title,body,created_at
job.articles.EXPORT_FILE=./exports/00-${job.articles.TABLE_NAME}-${EXPORT_DATE}-2G
job.articles.WHERE=created_at >= '${MONTH_START}'
job.articles.SPLIT.body=4000,3
job.articles.COMPRESS.ENABLED=true
job.articles.COMPRESS.MODE=gz
job.articles.COMPRESS.OVERWRITE=true
job.articles.COMPRESS.REMOVE_ORIGINAL=true
job.articles.TRANSFER.ENABLED=true
job.articles.TRANSFER.DIR=${ENV_EDP_OUT_PATH}
job.articles.TRANSFER.MODE=move
job.articles.TRANSFER.OVERWRITE=true
job.articles.TRANSFER.RENAME=00-${JOB_NAME}-${EXPORT_DATE}-2G.gz

# Job: var_expansion (ENV_* path expansion)
job.var_expansion.DB_PROFILE=primary
job.var_expansion.TABLE_NAME=var_expansion
job.var_expansion.COLUMNS=id,title,body,created_at
job.var_expansion.EXPORT_FILE=${ENV_GTP_TEMP_PATH}/00-${job.var_expansion.TABLE_NAME}-${EXPORT_DATE}-2G
job.var_expansion.SPLIT.body=4000,3
job.var_expansion.COMPRESS.ENABLED=true
job.var_expansion.COMPRESS.MODE=gz
job.var_expansion.COMPRESS.OVERWRITE=true
job.var_expansion.COMPRESS.REMOVE_ORIGINAL=true
job.var_expansion.TRANSFER.ENABLED=true
job.var_expansion.TRANSFER.DIR=${ENV_EDP_OUT_PATH}
job.var_expansion.TRANSFER.MODE=copy
job.var_expansion.TRANSFER.OVERWRITE=true
job.var_expansion.TRANSFER.RENAME=00-${JOB_NAME}-${EXPORT_DATE}-2G.gz

# Job: reporting_orders (postgres profile example)
job.reporting_orders.DB_PROFILE=reporting
job.reporting_orders.TABLE_NAME=orders
job.reporting_orders.COLUMNS=id,total,created_at
job.reporting_orders.EXPORT_FILE=./exports/reporting_orders_${EXPORT_DATE}.csv
job.reporting_orders.WHERE=total >= 500

# Job: no_filter (no WHERE clause — exports everything)
job.no_filter.DB_PROFILE=primary
job.no_filter.TABLE_NAME=logs
job.no_filter.COLUMNS=id,message,created_at
job.no_filter.EXPORT_FILE=./exports/logs_${EXPORT_DATE}.csv
