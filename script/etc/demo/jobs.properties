# Demo jobs for manual checks of exportctl.sh.
#
# The demo database connection lives in env.properties; each job repeats the
# connection block because .properties has no include mechanism.

# Basic successful job
job.users.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.users.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.users.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.users.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.users.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.users.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.users.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.users.TABLE_NAME=users
job.users.COLUMNS=id,name,email
job.users.EXPORT_FILE=${ENV_EXPORT_ROOT}/users_${EXPORT_DATE}.csv
job.users.WHERE=status = 'active'

# MySQL split-column example
job.article_body.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.article_body.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.article_body.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.article_body.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.article_body.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.article_body.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.article_body.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.article_body.TABLE_NAME=articles
job.article_body.COLUMNS=id,title,body,created_at
job.article_body.EXPORT_FILE=${ENV_EXPORT_ROOT}/articles_${EXPORT_DATE}.csv
job.article_body.WHERE=created_at >= '${MONTH_START}'
job.article_body.SPLIT.body=4000,3

# Date-variable usage
job.daily_orders.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.daily_orders.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.daily_orders.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.daily_orders.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.daily_orders.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.daily_orders.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.daily_orders.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.daily_orders.TABLE_NAME=orders
job.daily_orders.COLUMNS=id,total,created_at
job.daily_orders.EXPORT_FILE=${ENV_EXPORT_ROOT}/orders_${YESTERDAY}.csv
job.daily_orders.WHERE=created_at BETWEEN '${YESTERDAY}' AND '${TODAY}'

# Compression only
job.audit.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.audit.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.audit.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.audit.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.audit.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.audit.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.audit.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.audit.TABLE_NAME=audit_log
job.audit.COLUMNS=id,actor,action,created_at
job.audit.EXPORT_FILE=${ENV_ARCHIVE_ROOT}/audit_${EXPORT_MONTH}.csv
job.audit.WHERE=created_at BETWEEN '${MONTH_START}' AND '${MONTH_END}'
job.audit.COMPRESS.ENABLED=true
job.audit.COMPRESS.MODE=gz
job.audit.COMPRESS.OVERWRITE=true

# Transfer with rename (single artifact, no file split)
job.finance.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.finance.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.finance.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.finance.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.finance.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.finance.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.finance.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.finance.TABLE_NAME=finance_report
job.finance.COLUMNS=id,amount,biz_date
job.finance.EXPORT_FILE=${ENV_EXPORT_ROOT}/finance_${EXPORT_DATE}.csv
job.finance.WHERE=biz_date = '${EXPORT_DATE}'
job.finance.COMPRESS.ENABLED=true
job.finance.COMPRESS.MODE=gz
job.finance.COMPRESS.OVERWRITE=true
job.finance.TRANSFER.ENABLED=true
job.finance.TRANSFER.DIR=${ENV_TRANSFER_ROOT}
job.finance.TRANSFER.MODE=copy
job.finance.TRANSFER.OVERWRITE=true
job.finance.TRANSFER.RENAME=00-${job.finance.TABLE_NAME}-${EXPORT_DATE}.${job.finance.COMPRESS.MODE}

# File split: gzip parts capped by MAX_SIZE, ${PART} in EXPORT_FILE and the
# rename. The "2G" in the name is a business marker (full vs incremental), not
# a size - only FILE_SPLIT.MAX_SIZE controls the split.
job.events_split.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.events_split.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.events_split.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.events_split.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.events_split.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.events_split.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.events_split.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.events_split.TABLE_NAME=user_events
job.events_split.COLUMNS=id,user_id,event_type,created_at
job.events_split.EXPORT_FILE=${ENV_EXPORT_ROOT}/${PART}-LENS-${job.events_split.TABLE_NAME}-${EXPORT_DATE}-2G.${job.events_split.COMPRESS.MODE}
job.events_split.WHERE=created_at >= '${MONTH_START}'
job.events_split.COMPRESS.ENABLED=true
job.events_split.COMPRESS.MODE=gz
job.events_split.COMPRESS.OVERWRITE=true
job.events_split.FILE_SPLIT.ENABLED=true
job.events_split.FILE_SPLIT.MAX_SIZE=2G
job.events_split.FILE_SPLIT.INDEX_WIDTH=2
job.events_split.TRANSFER.ENABLED=true
job.events_split.TRANSFER.DIR=${ENV_TRANSFER_ROOT}
job.events_split.TRANSFER.MODE=copy
job.events_split.TRANSFER.OVERWRITE=true
job.events_split.TRANSFER.RENAME=${PART}-LENS-${job.events_split.TABLE_NAME}-${EXPORT_DATE}-2G.${job.events_split.COMPRESS.MODE}

# Alternate DB type, useful for plan inspection
job.reporting_snapshot.DB_TYPE=postgres
job.reporting_snapshot.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.reporting_snapshot.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.reporting_snapshot.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.reporting_snapshot.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.reporting_snapshot.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.reporting_snapshot.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.reporting_snapshot.TABLE_NAME=reporting_snapshot
job.reporting_snapshot.COLUMNS=id,metric_name,metric_value
job.reporting_snapshot.EXPORT_FILE=${ENV_EXPORT_ROOT}/reporting_snapshot_${EXPORT_DATE}.txt
job.reporting_snapshot.FIELD_SEPARATOR=|
job.reporting_snapshot.LINE_TERMINATOR=\n
job.reporting_snapshot.WHERE=snapshot_date = '${EXPORT_DATE}'

# Invalid job on purpose: missing DB connection fields
job.invalid_missing_db.DB_TYPE=mysql
job.invalid_missing_db.TABLE_NAME=broken_table
job.invalid_missing_db.COLUMNS=id
job.invalid_missing_db.EXPORT_FILE=${ENV_EXPORT_ROOT}/broken.csv

# Invalid job on purpose: FILE_SPLIT with tar.gz compression
job.invalid_split_tar.DB_TYPE=${ENV_LENS_MNGT_TDSQL_TYPE}
job.invalid_split_tar.DB_HOST=${ENV_LENS_MNGT_TDSQL_HOST}
job.invalid_split_tar.DB_PORT=${ENV_LENS_MNGT_TDSQL_PORT}
job.invalid_split_tar.DB_NAME=${ENV_LENS_MNGT_TDSQL_NAME}
job.invalid_split_tar.DB_USER=${ENV_LENS_MNGT_TDSQL_USER}
job.invalid_split_tar.DB_PASSWORD_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_FILE}
job.invalid_split_tar.DB_PASSWORD_KEY_FILE=${ENV_LENS_MNGT_TDSQL_PASSWORD_KEY_FILE}
job.invalid_split_tar.TABLE_NAME=events
job.invalid_split_tar.COLUMNS=id,payload
job.invalid_split_tar.EXPORT_FILE=${ENV_EXPORT_ROOT}/${PART}-events_${EXPORT_DATE}.tgz
job.invalid_split_tar.FILE_SPLIT.ENABLED=true
job.invalid_split_tar.FILE_SPLIT.MAX_SIZE=2G
job.invalid_split_tar.COMPRESS.ENABLED=true
job.invalid_split_tar.COMPRESS.MODE=tar.gz
